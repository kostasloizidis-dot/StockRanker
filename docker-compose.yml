version: '3.9'
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.Api
    ports:
      - "5001:80"
    environment:
      - ASPNETCORE_URLS=http://+:80
  ui:
    build:
      context: .
      dockerfile: Dockerfile.Ui
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ApiBaseUrl=http://api:80
    depends_on:
      - api
